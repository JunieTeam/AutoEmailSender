name: 构建发布草稿

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v3.0.0；更新说明取自标签上的 CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: 核对标签、工作区版本和更新日志
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from datetime import date
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"标签 {tag} 与工作区版本 {version} 不一致")
          # The newest section, dated, is this version's; it is the Release's text.
          changelog = Path("CHANGELOG.md").read_text()
          sections = re.split(r"^## ", changelog, flags=re.M)[1:]
          heading, _, body = (sections[0] if sections else "").partition("\n")
          dated = re.fullmatch(rf"{re.escape(version)}（(\d{{4}}-\d{{2}}-\d{{2}})）", heading.strip())
          try:
              date.fromisoformat(dated[1] if dated else "")
          except ValueError:
              raise SystemExit(f"CHANGELOG.md 最上面要是写好日期的 {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"notes<<NOTES_END\n{body.strip()}\nNOTES_END\n")
          print(f"已核对 {tag}")
          PY

  bundle:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Both runs merge their platform into latest.json in the same draft.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Auto Email Sender ${{ inputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm exec tauri
          args: --config crates/app/tauri.agent.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 验证 macOS 整包签名
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "target/${{ matrix.target }}/release/bundle/macos/Auto Email Sender.app"

  manifest:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: 更新清单带上到这一版为止的全部更新日志
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        # The app shows every version after its own, so the notes are the whole changelog.
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir manifest
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("manifest/latest.json")
          manifest = json.loads(path.read_text())
          manifest["notes"] = Path("CHANGELOG.md").read_text().strip()
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          gh release upload "$RELEASE_TAG" manifest/latest.json --clobber
